apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: qatra
data:
  loki.yaml: |
    auth_enabled: false
    server:
      http_listen_port: 3100
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: qatra
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
    spec:
      containers:
        - name: loki
          image: grafana/loki:3.1.0
          ports:
            - containerPort: 3100
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: qatra
spec:
  selector:
    app: loki
  ports:
    - port: 3100
      targetPort: 3100