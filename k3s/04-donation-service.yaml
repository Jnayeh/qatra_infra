apiVersion: v1
kind: ConfigMap
metadata:
  name: donation-service-config
  namespace: qatra
data:

  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/qatra
  SPRING_DATASOURCE_USERNAME: qatra
  SPRING_DATASOURCE_PASSWORD: qatra
  SPRING_JPA_HIBERNATE_DDL_AUTO: update

  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka-0.kafka.qatra.svc.cluster.local:9092

  SPRING_DATA_REDIS_HOST: redis
  SPRING_DATA_REDIS_PORT: "6379"
  SPRING_CACHE_TYPE: redis

  SPRING_DEVTOOLS_RESTART: "false"
  SPRING_DEVTOOLS_LIVERELOAD: "false"

  KAFKA_TOPIC_PASSWORD_RESET: password.reset
  KAFKA_TOPIC_EMAIL_VERIFICATION: email.verification
  KAFKA_TOPIC_NOTIFICATION_RESULT: notification.result
  KAFKA_TOPIC_ELIGIBILITY_REMINDER: eligibility.reminder

  JWT_SECRET: QatraSecretKeyMustBeAtLeast256BitsLongForHS256AlgorithmMinimum

  CORS_ALLOWED_ORIGINS: https://qatra-app.zayenha.app,https://qatra-api.zayenha.app,https://qatra-ws.zayenha.app

  OTEL_SERVICE_NAME: donation-service
  OTEL_TRACES_SAMPLER: parentbased_traceidratio
  OTEL_TRACES_SAMPLER_ARG: "1.0"
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  OTEL_LOGS_EXPORTER: none
  OTEL_METRICS_EXPORTER: none
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: donation-service
  namespace: qatra
spec:
  replicas: 1
  selector:
    matchLabels:
      app: donation-service
  template:
    metadata:
      labels:
        app: donation-service
    spec:
      containers:
        - name: donation-service
          image: qatra/donation-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: donation-service-config
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: donation-service
  namespace: qatra
spec:
  selector:
    app: donation-service
  ports:
    - port: 8080
      targetPort: 8080
