apiVersion: v1
kind: ConfigMap
metadata:
  name: donation-service-config
  namespace: qatra
data:

  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/qatra
  SPRING_DATASOURCE_USERNAME: qatra
  SPRING_DATASOURCE_PASSWORD: qatra
  SPRING_JPA_HIBERNATE_DDL_AUTO: update

  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka-0.kafka.qatra.svc.cluster.local:9092

  SPRING_DATA_REDIS_HOST: redis
  SPRING_DATA_REDIS_PORT: "6379"

  JWT_SECRET: QatraSecretKeyMustBeAtLeast256BitsLongForHS256AlgorithmMinimum

  CORS_ALLOWED_ORIGINS: https://qatra.zayenha.app
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: donation-service
  namespace: qatra
spec:
  replicas: 1
  selector:
    matchLabels:
      app: donation-service
  template:
    metadata:
      labels:
        app: donation-service
    spec:
      containers:
        - name: donation-service
          image: qatra/donation-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: donation-service-config
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: donation-service
  namespace: qatra
spec:
  selector:
    app: donation-service
  ports:
    - port: 8080
      targetPort: 8080