apiVersion: apps/v1
kind: Deployment
metadata:
  name: redisinsight
  namespace: qatra
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redisinsight
  template:
    metadata:
      labels:
        app: redisinsight
    spec:
      containers:
        - name: redisinsight
          image: redis/redisinsight:latest
          ports:
            - containerPort: 5540
          env:
            - name: RI_REDIS_HOST
              value: redis
            - name: RI_REDIS_PORT
              value: "6379"
          readinessProbe:
            httpGet:
              path: /
              port: 5540
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 5540
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: redisinsight
  namespace: qatra
spec:
  selector:
    app: redisinsight
  ports:
    - port: 5540
      targetPort: 5540
