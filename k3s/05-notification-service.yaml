apiVersion: v1
kind: ConfigMap
metadata:
  name: notification-service-config
  namespace: qatra
data:

  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/qatra_notification
  SPRING_DATASOURCE_USERNAME: qatra_notification
  SPRING_DATASOURCE_PASSWORD: qatra_notification
  SPRING_JPA_HIBERNATE_DDL_AUTO: update

  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka-0.kafka.qatra.svc.cluster.local:9092

  JWT_SECRET: QatraSecretKeyMustBeAtLeast256BitsLongForHS256AlgorithmMinimum

  SPRING_MAIN_ALLOW_BEAN_DEFINITION_OVERRIDING: "true"

  CORS_ALLOWED_ORIGINS: https://qatra-app.zayenha.app,https://qatra-api.zayenha.app,https://qatra-ws.zayenha.app

  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: qatra
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: qatra/notification-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8082
          envFrom:
            - configMapRef:
                name: notification-service-config
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: qatra
spec:
  selector:
    app: notification-service
  ports:
    - name: http
      port: 8082
      targetPort: 8082
    - name: ws
      port: 8081
      targetPort: 8082
