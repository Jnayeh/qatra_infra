apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: qatra
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.57
          ports:
            - containerPort: 16686
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: qatra
spec:
  selector:
    app: jaeger
  ports:
    - port: 16686
      targetPort: 16686