apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: qatra
data:
  promtail.yaml: |
    server:
      http_listen_port: 9080
      grpc_listen_port: 0
    positions:
      filename: /tmp/positions.yaml
    clients:
      - url: http://loki:3100/loki/api/v1/push
    scrape_configs:
      - job_name: k3s-pods
        pipeline_stages:
          - cri: {}
          - regex:
              expression: '^(?P<namespace>[^.]+)\.(?P<pod_name>[^.]+)\.(?P<container_name>.+)$'
              source: filename
          - labels:
              namespace:
              pod_name:
              container_name:
        static_configs:
          - targets:
              - localhost
            labels:
              job: k3s-pods
              __path__: /var/log/pods/*/*/*.log
      - job_name: k3s-system
        pipeline_stages:
          - cri: {}
          - regex:
              expression: '^(?P<namespace>[^.]+)\.(?P<pod_name>[^.]+)\.(?P<container_name>.+)$'
              source: filename
          - labels:
              namespace:
              pod_name:
              container_name:
        static_configs:
          - targets:
              - localhost
            labels:
              job: k3s-system
              __path__: /var/log/pods/kube-system_*/*/*.log
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail
  namespace: qatra
spec:
  selector:
    matchLabels:
      app: promtail
  template:
    metadata:
      labels:
        app: promtail
    spec:
      serviceAccountName: promtail
      tolerations:
        - operator: Exists
      containers:
        - name: promtail
          image: grafana/promtail:3.1.0
          ports:
            - containerPort: 9080
          args:
            - -config.file=/etc/promtail/promtail.yaml
          volumeMounts:
            - name: promtail-config
              mountPath: /etc/promtail
            - name: varlog
              mountPath: /var/log
              readOnly: true
            - name: containers
              mountPath: /var/lib/docker/containers
              readOnly: true
            - name: positions
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /ready
              port: 9080
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: promtail-config
          configMap:
            name: promtail-config
        - name: varlog
          hostPath:
            path: /var/log
        - name: containers
          hostPath:
            path: /var/lib/docker/containers
        - name: positions
          emptyDir: {}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: promtail
  namespace: qatra
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: promtail
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/proxy", "services", "endpoints", "pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: promtail
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: promtail
subjects:
  - kind: ServiceAccount
    name: promtail
    namespace: qatra
